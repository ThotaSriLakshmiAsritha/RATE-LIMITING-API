spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Supabase JWKS endpoint
          jwk-set-uri: ${SUPABASE_JWK_SET_URI:https://${SUPABASE_PROJECT_REF}.supabase.co/auth/v1/keys}

rate-limiting:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:5174
      - http://127.0.0.1:5173
      - http://127.0.0.1:5174
  supabase:
    issuer: ${SUPABASE_ISSUER:https://${SUPABASE_PROJECT_REF}.supabase.co/auth/v1}
    audience: ${SUPABASE_AUDIENCE:authenticated}

